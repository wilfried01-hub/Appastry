<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Appastry</title>
<meta name="theme-color" content="#2f6b4f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : barre latérale sur ordinateur, barre d'onglets en bas sur téléphone ; listes denses, détails en panneau. */
:root {
  --bg: #f6f7f2;
  --surface: #ffffff;
  --surface-2: #eef1e8;
  --line: #dde2d4;
  --fg: #2b211c;
  --muted: #6d675f;
  --accent: #2f6b4f;
  --accent-soft: #dcebdf;
  --accent-fg: #ffffff;
  --rasp: #b4325a;
  --rasp-soft: #f7e1e8;
  --amber: #a5670f;
  --amber-soft: #f6ead3;
  --blue: #3f5fb0;
  --blue-soft: #e2e8f6;
  --s1: #3f62c4;
  --s2: #b0721a;
  --shadow: 0 1px 2px rgba(43,33,28,.06), 0 4px 16px rgba(43,33,28,.06);
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 12px;
  --side: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171513; --surface: #211e1b; --surface-2: #2a2622; --line: #3a3530;
    --fg: #f1ece4; --muted: #a79f94; --accent: #7cc39b; --accent-soft: #24382c; --accent-fg: #10201a;
    --rasp: #f08aa9; --rasp-soft: #3d2029; --amber: #e6b25e; --amber-soft: #3a2d17; --blue: #9db3ef; --blue-soft: #232c44; --s1: #7b98ec; --s2: #c8862a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171513; --surface: #211e1b; --surface-2: #2a2622; --line: #3a3530;
  --fg: #f1ece4; --muted: #a79f94; --accent: #7cc39b; --accent-soft: #24382c; --accent-fg: #10201a;
  --rasp: #f08aa9; --rasp-soft: #3d2029; --amber: #e6b25e; --amber-soft: #3a2d17; --blue: #9db3ef; --blue-soft: #232c44; --s1: #7b98ec; --s2: #c8862a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.02rem; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Shell */
.app { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; padding: 20px 14px; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
.brand b { font-family: var(--font-display); font-size: 1.15rem; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: .78rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav svg { width: 19px; height: 19px; flex: none; }
.nav .badge { margin-left: auto; background: var(--rasp); color: #fff; font-size: .7rem; font-weight: 700; border-radius: 99px; padding: 0 7px; }
.side-foot { margin-top: auto; font-size: .78rem; color: var(--muted); padding: 0 8px; display: flex; flex-direction: column; gap: 6px; }
.sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; background: var(--muted); margin-right: 6px; }
.sync-dot.ok { background: var(--accent); } .sync-dot.err { background: var(--rasp); } .sync-dot.busy { background: var(--amber); }
main { min-width: 0; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head p { margin: 4px 0 0; color: var(--muted); }
.crumb { font-size: .85rem; color: var(--muted); text-decoration: none; display: inline-flex; gap: 4px; align-items: center; margin-bottom: 6px; }
.crumb svg { width: 15px; height: 15px; }
.crumb:hover { color: var(--accent); }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: .92rem; white-space: nowrap; text-decoration: none; color: var(--fg); }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--rasp); }
.btn.danger.solid { background: var(--rasp); border-color: var(--rasp); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: .84rem; }
.btn.icon { padding: 6px; }
.btn svg { width: 17px; height: 17px; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 11px; min-width: 0; }
.input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea.input { resize: vertical; min-height: 70px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: .84rem; font-weight: 600; color: var(--muted); min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.search { position: relative; flex: 1; min-width: 200px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 17px; color: var(--muted); }
.search .input { padding-left: 36px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: .84rem; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tag { display: inline-block; font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.warn { background: var(--amber-soft); color: var(--amber); }
.tag.up { background: var(--rasp-soft); color: var(--rasp); }
.tag.downp { background: var(--accent-soft); color: var(--accent); }
.tag.alg { background: var(--amber-soft); color: var(--amber); }
.allergens { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: currentColor; }
.st-todo { background: var(--amber-soft); color: var(--amber); }
.st-doing { background: var(--blue-soft); color: var(--blue); }
.st-ready { background: var(--accent-soft); color: var(--accent); }
.st-done { background: var(--surface-2); color: var(--muted); }
.st-cancel { background: var(--rasp-soft); color: var(--rasp); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.checks label { display: flex; gap: 7px; align-items: center; font-size: .88rem; font-weight: 500; color: var(--fg); padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.checks input { accent-color: var(--accent); }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-b { padding: 16px 18px; }
.empty { text-align: center; color: var(--muted); padding: 36px 16px; }
.empty b { display: block; color: var(--fg); font-size: 1.02rem; margin-bottom: 4px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 2px; }
a.stat:hover { border-color: var(--accent); }
.stat span { font-size: .82rem; color: var(--muted); font-weight: 500; }
.stat b { font-family: var(--font-display); font-size: 1.7rem; font-variant-numeric: tabular-nums; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }
td .sub { display: block; font-size: .8rem; color: var(--muted); }
.group-row td { background: var(--surface-2); font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 7px 14px; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; overflow: hidden; }
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card .photo { margin: -16px -16px 0; aspect-ratio: 16/10; background: var(--surface-2) center/cover no-repeat; max-width: none; }
.card .meta { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .84rem; }
.card .price { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: auto; gap: 8px; }
.card .price b { font-family: var(--font-display); font-size: 1.3rem; }
.card .price small { color: var(--muted); }
.hero-photo { width: 100%; max-height: 340px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); display: block; }

/* Cost breakdown */
.split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.costbox { display: flex; flex-direction: column; gap: 10px; }
.costline { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.costline span { color: var(--muted); }
.costline.total { border-top: 1px solid var(--line); padding-top: 10px; font-weight: 700; font-size: 1.05rem; }
.costline.total span { color: var(--fg); }
.costline.good b { color: var(--accent); } .costline.bad b { color: var(--rasp); }
.big { font-family: var(--font-display); font-size: 2.1rem; font-variant-numeric: tabular-nums; line-height: 1; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-direction: column; gap: 6px; font-size: .86rem; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend div em { font-style: normal; margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.share { width: 70px; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 8px; }
.share i { display: block; height: 100%; background: var(--accent); }

/* Steps */
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; cursor: pointer; }
ol.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .82rem; display: grid; place-items: center; }
ol.steps li.done { color: var(--muted); text-decoration: line-through; }
ol.steps li.done::before { content: "✓"; }

/* Scaler */
.scaler { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); overflow: hidden; }
.scaler button { border: 0; background: transparent; padding: 7px 11px; cursor: pointer; font-weight: 700; }
.scaler button:hover { background: var(--surface-2); }
.scaler input { width: 56px; border: 0; text-align: center; background: transparent; padding: 7px 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.scaler span { padding-right: 10px; color: var(--muted); font-size: .86rem; }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(20,16,12,.45); display: flex; align-items: flex-start; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 660px; margin: 4vh 0; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 6px; }
.modal-b { padding: 12px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-f { padding: 14px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 6px; }
.modal-f .left { margin-right: auto; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row-line { display: grid; grid-template-columns: minmax(0, 1fr) 90px 100px 34px; gap: 8px; align-items: center; }
.row-line.cake { grid-template-columns: minmax(0, 1fr) 110px 34px; }
.row-line .fixed-unit { font-size: .84rem; color: var(--muted); padding: 0 6px; }
.step-line { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.step-line > b { padding-top: 9px; color: var(--muted); font-size: .85rem; text-align: center; }
.step-line .acts { display: flex; gap: 2px; }
.hint { font-size: .8rem; color: var(--muted); font-weight: 500; }
.sectlabel { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.photo-edit { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.photo-edit img { width: 96px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.hist { display: flex; flex-direction: column; gap: 4px; font-size: .86rem; }
.hist div { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.hist span { color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 600; font-size: .9rem; z-index: 60; box-shadow: var(--shadow); }
.confirm-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--rasp-soft); color: var(--rasp); border-radius: 9px; padding: 8px 12px; font-weight: 600; font-size: .88rem; }

.order-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.order-item:last-child { border-bottom: 0; }
.order-item .nm { font-weight: 600; min-width: 0; }
.order-item .nm small { display: block; color: var(--muted); font-weight: 500; }
.add-line { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto; gap: 8px; }
.notice { background: var(--amber-soft); color: var(--amber); border-radius: 10px; padding: 10px 14px; font-size: .88rem; font-weight: 500; margin: 0; }
.notice.ok { background: var(--accent-soft); color: var(--accent); }
.notice.err { background: var(--rasp-soft); color: var(--rasp); }

/* Commandes */
.orders { display: flex; flex-direction: column; gap: 10px; }
.ocard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 14px; align-items: center; cursor: pointer; }
.ocard:hover { border-color: var(--accent); }
.odate { text-align: center; border-right: 1px solid var(--line); padding-right: 12px; }
.odate b { display: block; font-family: var(--font-display); font-size: 1.6rem; line-height: 1; }
.odate span { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.odate.late b { color: var(--rasp); }
.ocard .who { font-weight: 700; }
.ocard .what { color: var(--muted); font-size: .86rem; }
.ocard .money { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-variant-numeric: tabular-nums; }
.ocard .money b { font-family: var(--font-display); font-size: 1.15rem; }
.ocard .money small { color: var(--muted); font-size: .78rem; }

.tabbar { display: none; }
.print-only { display: none; }

/* Prix du marché */
.mkt { display: flex; flex-direction: column; gap: 8px; }
.mkt-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.mkt-row b { display: block; }
.mkt-row small { color: var(--muted); display: block; font-size: .8rem; }
.mkt-row .p { text-align: right; font-variant-numeric: tabular-nums; }
.switch { display: flex; gap: 8px; align-items: center; font-size: .88rem; font-weight: 500; color: var(--fg); }
.switch input { accent-color: var(--accent); width: 16px; height: 16px; }

/* Graphique */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover, .chart .hit.on { fill: var(--surface-2); opacity: .6; }
.chart-tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 10px; padding: 8px 12px; font-size: .84rem; min-width: 170px; z-index: 5; }
.chart-tip div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.chart-tip b { font-weight: 700; }
.legend-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: .84rem; color: var(--muted); }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }

/* Documents (devis, facture) */
.doc { background: #fff; color: #222; border: 1px solid var(--line); border-radius: 6px; padding: 40px 44px; max-width: 820px; width: 100%; margin: 0 auto; font-size: 14px; color-scheme: light; }
.doc h1 { font-size: 1.7rem; color: #222; }
.doc .row { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.doc .muted { color: #666; }
.doc table { margin-top: 18px; }
.doc th { color: #666; border-bottom: 1.5px solid #222; }
.doc td { border-bottom: 1px solid #ddd; }
.doc .totals { margin-left: auto; width: min(320px, 100%); margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.doc .totals div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.doc .totals .grand { border-top: 1.5px solid #222; padding-top: 8px; font-weight: 700; font-size: 1.08rem; }
.doc .foot { margin-top: 28px; font-size: 12px; color: #666; display: flex; flex-direction: column; gap: 4px; }

  const out = normalize(clone(SEED)); out.ingredients = []; out.recipes = []; out.cakes = []; out.order = []; out.orders = [];
  const ings = data.Ingredient || data.ingredients || [];
  ings.forEach(i => out.ingredients.push({ id:i.id||uid('i'), name:(i.name||'').trim(), category:i.category||'Autres', unit:i.unit||'g', qty:+i.purchase_quantity||+i.qty||1, price:+(i.price_per_unit ?? i.price ?? 0), store:(i.store||'').trim(), allergens:[], history:[] }));
  const recs = data.BaseRecipe || data.recipes || [];
  recs.forEach(r => out.recipes.push({ id:r.id||uid('r'), name:(r.name||'').trim(), category:r.category||'Autres', servings:+r.base_servings||+r.servings||1, prep:+r.prep_time||0, cook:+r.cook_time||0, notes:r.notes||'',
    items:(r.ingredients||[]).map(x => ({ ing:x.ingredient_id, qty:+x.quantity, unit:x.unit })),
    steps:(r.steps||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0)).map(s => typeof s === 'string' ? s : s.instruction) }));
  const cakes = data.Cake || data.cakes || [];
  cakes.forEach(c => out.cakes.push({ id:c.id||uid('c'), name:(c.name||'').trim(), description:c.description||'', servings:+c.base_servings||+c.servings||1, assemblyTime:0, salePrice:0, image:'',
    parts:(c.recipes||[]).map(x => ({ rec:x.recipe_id, mult:+x.multiplier||1 })),
    steps:(c.assembly_steps||[]).map(s => typeof s === 'string' ? s : s.instruction) }));
  return out;
}

/* ---------- Calculs ---------- */
function unitPrice(ing){ // prix par unité de base (g, ml, unité)
  const [, f] = UNIT_BASE[ing.unit] || ['g',1];
  const baseQty = (+ing.qty || 0) * f;
  return baseQty > 0 ? (+ing.price || 0) / baseQty : 0;
}
function toBase(qty, unit){ const [b, f] = UNIT_BASE[unit] || ['g',1]; return [qty * f, b]; }
function baseOf(unit){ return (UNIT_BASE[unit] || ['g'])[0]; }
function lineCost(item, factor = 1){
  const ing = ING(item.ing); if (!ing) return 0;
  const [q] = toBase((+item.qty || 0) * factor, item.unit);
  return q * unitPrice(ing);
}
/* Une recette peut contenir des ingrédients ({ing, qty, unit}) ou d'autres recettes ({sub, mult}) */
function itemCost(it, factor, depth){
  if (it.sub) { const s = REC(it.sub); return s && depth < 6 ? recipeCost(s, (+it.mult || 0) * factor, depth + 1) : 0; }
  return lineCost(it, factor);
}
function recipeCost(r, factor = 1, depth = 0){ return (r.items || []).reduce((s, it) => s + itemCost(it, factor, depth), 0); }
function recipeTime(r, depth = 0){ return (+r.prep || 0) + (r.items || []).reduce((s, it) => { const sr = it.sub && REC(it.sub); return sr && depth < 6 ? s + recipeTime(sr, depth + 1) : s; }, 0); }
function expand(r, factor, depth = 0){ // liste à plat des recettes à préparer (sous-recettes d'abord)
  if (depth > 6) return [];
  const subs = (r.items || []).filter(it => it.sub && REC(it.sub)).flatMap(it => expand(REC(it.sub), (+it.mult || 0) * factor, depth + 1));
  return subs.concat([{ r, factor }]);
}
function contains(r, targetId, depth = 0){ if (r.id === targetId) return true; if (depth > 6) return false; return (r.items||[]).some(it => it.sub && REC(it.sub) && contains(REC(it.sub), targetId, depth + 1)); }
function cakeCost(c, factor = 1){ return (c.parts || []).reduce((s, p) => { const r = REC(p.rec); return r ? s + recipeCost(r, p.mult * factor) : s; }, 0); }
function cakeTime(c){ return (c.parts||[]).reduce((s,p)=>{ const r=REC(p.rec); return r ? s + recipeTime(r) : s; }, 0) + (+c.assemblyTime||0); }
function labor(min){ return (min / 60) * (+db.settings.hourlyRate || 0); }
function recipeAllergens(r, depth = 0){
  const set = new Set();
  (r.items || []).forEach(it => {
    if (it.sub) { const s = REC(it.sub); if (s && depth < 6) recipeAllergens(s, depth + 1).forEach(a => set.add(a)); }
    else { const ing = ING(it.ing); if (ing) (ing.allergens || []).forEach(a => set.add(a)); }
  });
  return ALLERGENS.filter(a => set.has(a));
}
function cakeAllergens(c){ const set = new Set(); (c.parts||[]).forEach(p => { const r = REC(p.rec); if (r) recipeAllergens(r).forEach(a => set.add(a)); }); return ALLERGENS.filter(a => set.has(a)); }
function usage(ingId){ return db.recipes.filter(r => (r.items||[]).some(i => i.ing === ingId)); }
function recipeUsage(recId){ return db.cakes.filter(c => (c.parts||[]).some(p => p.rec === recId)); }
function recipeParents(recId){ return db.recipes.filter(r => (r.items||[]).some(i => i.sub === recId)); }
/* Prix de vente conseillé : coût de revient × coefficient, puis TVA */
function vatRate(){ return db.settings.company && db.settings.company.vatExempt ? 0 : (+db.settings.tva || 0); }
function suggested(cost){ const ht = cost * (+db.settings.marginCoef || 1); return { ht, ttc: ht * (1 + vatRate() / 100) }; }
function ttcToHt(ttc){ return ttc / (1 + vatRate() / 100); }

/* Coût d'une liste d'éléments de commande [{type:'c'|'r', id, qty}] */
function computeOrder(list){
  const items = (list || []).map((o, k) => {
    const src = o.type === 'c' ? CAKE(o.id) : REC(o.id); if (!src) return null;
    const f = (+o.qty || 0) / (src.servings || 1);
    const recs = o.type === 'c' ? (src.parts||[]).map(p => ({ r: REC(p.rec), factor: p.mult * f })).filter(x => x.r) : [{ r: src, factor: f }];
    const time = o.type === 'c' ? cakeTime(src) : recipeTime(src);
    const mat = recs.reduce((s, x) => s + recipeCost(x.r, x.factor), 0);
    const allergens = o.type === 'c' ? cakeAllergens(src) : recipeAllergens(src);
    return { o, k, src, recs, time, mat, tot: mat + labor(time), allergens };
  }).filter(Boolean);
  const mat = items.reduce((s, x) => s + x.mat, 0);
  const time = items.reduce((s, x) => s + x.time, 0);
  const lab = labor(time);
  const parts = items.reduce((s, x) => s + (+x.o.qty || 0), 0);
  const allergens = ALLERGENS.filter(a => items.some(x => x.allergens.includes(a)));
  return { items, mat, time, lab, tot: mat + lab, parts, allergens, agg: aggregate(items.flatMap(x => x.recs)) };
}
function aggregate(list){ // list: [{r, factor}] ; développe les sous-recettes
  const m = new Map();
  list.flatMap(x => expand(x.r, x.factor)).forEach(({ r, factor }) => (r.items||[]).forEach(it => {
    if (it.sub) return;
    const ing = ING(it.ing); if (!ing) return;
    const [q, b] = toBase(it.qty * factor, it.unit);
    const key = ing.id + '|' + b;
    const cur = m.get(key) || { id: ing.id, name: ing.name, base: b, q: 0, cost: 0, cat: ing.category, store: ing.store };
    cur.q += q; cur.cost += q * unitPrice(ing); m.set(key, cur);
  }));
  return [...m.values()].sort((a,b) => a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name));
}

/* ---------- Prix du marché (base collaborative Open Prices d'Open Food Facts) ---------- */
const OFF = 'https://prices.openfoodfacts.org/api/v1';
const OFF_UNIT = { g:'g', kg:'kg', ml:'ml', cl:'cl', l:'L', L:'L' };
function median(a){ const s = a.slice().sort((x,y)=>x-y); const n = s.length; return n ? (n % 2 ? s[(n-1)/2] : (s[n/2-1] + s[n/2]) / 2) : 0; }
async function offJson(url){ const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
async function marketPrice(code){
  const j = await offJson(`${OFF}/prices?product_code=${encodeURIComponent(code)}&currency=EUR&location__osm_address_country_code=FR&size=12&order_by=-date`);
  const yearAgo = new Date(Date.now() - 365*864e5).toISOString().slice(0,10);
  let items = (j.items || []).filter(i => i.price > 0 && !i.price_is_discounted);
  const recent = items.filter(i => (i.date || '') >= yearAgo);
  if (recent.length) items = recent;
  if (!items.length) return null;
  const last = items[0];
  return { price: Math.round(median(items.map(i => i.price)) * 100) / 100, n: items.length, date: last.date || '', store: (last.location && (last.location.osm_brand || last.location.osm_name)) || '' };
}
function productQty(p, unit){
  const u = OFF_UNIT[p.product_quantity_unit];
  const b = baseOf(unit || 'g');
  if (b === 'unité') { const m = String(p.quantity || '').match(/(\d+)/); return { qty: m ? +m[1] : 1, unit: 'unité' }; }
  if (u && p.product_quantity > 0) return { qty: +p.product_quantity, unit: u };
  return null;
}
async function marketSearch(name, unit){
  const j = await offJson(`${OFF}/products?product_name__like=${encodeURIComponent(name.trim())}&size=10&order_by=-price_count`);
  const prods = (j.items || []).filter(p => p.price_count > 0).slice(0, 6);
  const res = await Promise.all(prods.map(async p => { try { const q = productQty(p, unit); if (!q) return null; const m = await marketPrice(p.code); return m ? { p, m, q } : null; } catch(e) { return null; } }));
  return res.filter(Boolean);
}
async function refreshMarketPrices(silent){
  const list = db.ingredients.filter(i => i.offCode && i.offAuto);
  if (!list.length) { if (!silent) toast('Aucun ingrédient relié à un prix du marché'); return; }
  let changed = 0, failed = 0;
  for (const ing of list) {
    try {
      const m = await marketPrice(ing.offCode); if (!m) continue;
      if (Math.abs(m.price - (+ing.price || 0)) > 0.005) {
        if (!ing.history.length) ing.history.push({ d: null, price: +ing.price, qty: +ing.qty, unit: ing.unit });
        ing.price = m.price; ing.history.push({ d: today(), price: m.price, qty: +ing.qty, unit: ing.unit, src: 'marché' }); changed++;
      }
      ing.marketDate = m.date;
    } catch(e) { failed++; }
  }
  db.settings.lastPriceRefresh = Date.now(); save(); rerender();
  if (failed === list.length) { if (!silent) toast('Base de prix injoignable pour le moment'); return; }
  if (!silent || changed) toast(changed ? (changed > 1 ? changed + ' prix mis à jour' : '1 prix mis à jour') : 'Prix déjà à jour');
}

/* ---------- Stock ---------- */
function isLow(i){ return i.stock != null && i.stockMin > 0 && +i.stock <= i.stockMin; }
function useStock(agg){ let n = 0; agg.forEach(a => { const ing = ING(a.id); if (ing && ing.stock != null) { ing.stock = Math.max(0, Math.round((+ing.stock - a.q) * 100) / 100); n++; } }); return n; }
function addStock(agg){ let n = 0; agg.forEach(a => { const ing = ING(a.id); if (ing && a.buy > 0) { ing.stock = Math.round(((+ing.stock || 0) + a.buy) * 100) / 100; n++; } }); return n; }

/* ---------- Statistiques ---------- */
function statsData(){
  const now = new Date(); const months = [];
  for (let k = 5; k >= 0; k--) { const d = new Date(now.getFullYear(), now.getMonth() - k, 1); months.push({ key: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleDateString('fr-FR', { month:'short' }), long: d.toLocaleDateString('fr-FR', { month:'long', year:'numeric' }), ca:0, cost:0, n:0 }); }
  const best = new Map();
  db.orders.filter(o => o.status !== 'cancel' && o.date).forEach(o => {
    const c = computeOrder(o.items); const price = orderPrice(o, c);
    const m = months.find(x => x.key === o.date.slice(0,7));
    if (m) { m.ca += ttcToHt(price); m.cost += c.tot; m.n++; }
    c.items.forEach(x => { const k = x.o.type + x.o.id; const b = best.get(k) || { name: x.src.name, parts: 0, n: 0 }; b.parts += +x.o.qty || 0; b.n++; best.set(k, b); });
  });
  return { months, best: [...best.values()].sort((a,b) => b.parts - a.parts).slice(0, 5) };
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function chartHtml(months){
  const W = 640, H = 230, L = 56, R = 8, T = 12, B = 30;
  const max = Math.max(1, ...months.flatMap(m => [m.ca, m.cost]));
  const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const gw = (W - L - R) / months.length; const bw = Math.min(24, gw / 2 - 6);
  const bar = (x, v, tok) => { const h = y(0) - y(v); if (h < 0.5) return ''; const r = Math.min(4, h, bw / 2); const yt = y(v); return `<path d="M${x},${y(0)} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${y(0)} Z" fill="var(${tok})" pointer-events="none"/>`; };
  let grid = '';
  for (let v = 0; v <= top + 1e-9; v += step) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${eur0.format(v)}</text>`;
  const hits = months.map((m, k) => `<rect class="hit" data-m="${k}" x="${L + gw * k}" y="${T}" width="${gw}" height="${H - T - B}" rx="6"/>`).join('');
  const bars = months.map((m, k) => { const cx = L + gw * k + gw / 2; return bar(cx - bw - 1, m.ca, '--s1') + bar(cx + 1, m.cost, '--s2') + `<text x="${cx}" y="${H - 9}" text-anchor="middle">${esc(m.label)}</text>`; }).join('');
  return `<div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d’affaires HT et coût de revient sur les 6 derniers mois"><g class="grid">${grid}</g>${hits}${bars}</svg><div class="chart-tip" id="chart-tip" hidden></div></div>`;
}
function bindChart(months){
  const el = document.getElementById('chart'); if (!el) return; const tip = document.getElementById('chart-tip');
  el.querySelectorAll('.hit').forEach(r => {
    r.addEventListener('pointerenter', () => {
      const m = months[+r.dataset.m];
      tip.innerHTML = `<b style="text-transform:capitalize">${esc(m.long)}</b><div><span><span class="dot" style="background:var(--s1);display:inline-block;margin-right:6px"></span>CA HT</span><b>${E(m.ca)}</b></div><div><span><span class="dot" style="background:var(--s2);display:inline-block;margin-right:6px"></span>Coût de revient</span><b>${E(m.cost)}</b></div><div><span>Marge</span><b>${E(m.ca - m.cost)}</b></div><div><span>Commandes</span><b>${m.n}</b></div>`;
      tip.hidden = false;
      const box = el.getBoundingClientRect(), rb = r.getBoundingClientRect();
      tip.style.left = Math.max(0, Math.min(rb.left - box.left + rb.width / 2 - 95, box.width - 200)) + 'px'; tip.style.top = '-8px';
    });
    r.addEventListener('pointerleave', () => { tip.hidden = true; });
  });
}
function statsHtml(){
  const { months, best } = statsData();
  const has = months.some(m => m.n > 0);
  return `<section class="panel"><div class="panel-h"><h2>Statistiques des 6 derniers mois</h2>${has ? `<div class="legend-row"><span><span class="dot" style="background:var(--s1)"></span>Chiffre d’affaires HT</span><span><span class="dot" style="background:var(--s2)"></span>Coût de revient</span></div>` : ''}</div>
  <div class="panel-b" style="display:flex;flex-direction:column;gap:18px">
  ${has ? chartHtml(months) + `<div class="split">
    <div class="tbl-wrap"><table><thead><tr><th>Mois</th><th class="r">Cdes</th><th class="r">CA HT</th><th class="r">Marge</th></tr></thead><tbody>${months.slice().reverse().map(m => `<tr><td style="text-transform:capitalize">${esc(m.long)}</td><td class="r">${m.n}</td><td class="r">${E(m.ca)}</td><td class="r">${E(m.ca - m.cost)}</td></tr>`).join('')}</tbody></table></div>
    <div><div class="sectlabel" style="margin-bottom:8px">Meilleures ventes</div><div class="legend">${best.map((b, k) => `<div><b>${k + 1}.</b> ${esc(b.name)}<em>${plural(b.parts, 'part')} · ${plural(b.n, 'commande')}</em></div>`).join('')}</div></div>
  </div>` : `<div class="empty"><b>Pas encore de statistiques</b>Elles apparaîtront dès que tu auras des commandes datées.</div>`}
  </div></section>`;
}

/* ---------- Formatage ---------- */
const eur = new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR' });
const eur4 = new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', minimumFractionDigits:2, maximumFractionDigits:4 });
const nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 });
const eur0 = new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const pct = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0, signDisplay: 'always' });
const E = v => eur.format(v || 0);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function qtyLabel(q, unit){
  const [b] = UNIT_BASE[unit] || ['g'];
  const [bq] = toBase(q, unit);
  if (b === 'g' && bq >= 1000) return nf.format(bq/1000) + ' kg';
  if (b === 'ml' && bq >= 1000) return nf.format(bq/1000) + ' L';
  if (b === 'unité') { const r = Math.round(bq*100)/100; return nf.format(r) + (r > 1 ? ' unités' : ' unité'); }
  return nf.format(Math.round(bq*10)/10) + ' ' + b;
}
function refPrice(ing){ // prix lisible : €/kg, €/L ou €/unité
  const up = unitPrice(ing); const b = baseOf(ing.unit);
  if (b === 'g') return eur.format(up*1000) + '/kg';
  if (b === 'ml') return eur.format(up*1000) + '/L';
  return eur4.format(up) + '/unité';
}
const mins = m => { m = Math.round(m||0); if (m < 60) return m + ' min'; const h = Math.floor(m/60), r = m%60; return h + ' h' + (r ? ' ' + String(r).padStart(2,'0') : ''); };
const plural = (n, s, p) => n + ' ' + (n > 1 ? (p || s + 's') : s);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dateFr = (iso, opts) => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', opts || { day:'numeric', month:'long', year:'numeric' }) : '';
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + (+n || 0)); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const allergenTags = list => list.length ? `<span class="allergens">${list.map(a => `<span class="tag alg">${esc(a)}</span>`).join('')}</span>` : '<span class="hint">Aucun allergène renseigné</span>';

/* ---------- Thème ---------- */
function applyTheme(){
  const t = db.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

/* ---------- Synchronisation via un Gist GitHub privé ---------- */
const Sync = {
  cfg: { token: '', gistId: '', last: 0 },
  state: 'off', msg: '', timer: null,
  loadCfg(){ try { Object.assign(this.cfg, JSON.parse(localStorage.getItem(SYNC_KEY) || '{}')); } catch(e) {} this.state = this.cfg.token ? 'idle' : 'off'; },
  saveCfg(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(this.cfg)); } catch(e) {} },
  on(){ return !!(this.cfg.token && this.cfg.gistId); },
  set(state, msg){ this.state = state; this.msg = msg || ''; renderSideFoot(); const el = document.getElementById('sync-status'); if (el) el.innerHTML = syncStatusHtml(); },
  async api(path, opts = {}){
    const res = await fetch('https://api.github.com' + path, Object.assign({}, opts, { headers: Object.assign({ 'Authorization': 'Bearer ' + this.cfg.token, 'Accept': 'application/vnd.github+json' }, opts.body ? { 'Content-Type': 'application/json' } : {}) }));
    if (res.status === 401) throw new Error('Jeton refusé par GitHub : vérifie qu’il est valide et qu’il a le droit « gist ».');
    if (!res.ok) throw new Error('GitHub a répondu ' + res.status + '.');
    return res.json();
  },
  payload(){ return { files: { 'patisscalc.json': { content: JSON.stringify(db) } } }; },
  async connect(token){
    this.cfg.token = token.trim(); this.cfg.gistId = ''; this.set('busy', 'Connexion…');
    try {
      const gists = await this.api('/gists?per_page=100');
      const found = gists.find(g => g.files && g.files['patisscalc.json']);
      if (found) { this.cfg.gistId = found.id; this.saveCfg(); await this.pull(true); }
      else { const g = await this.api('/gists', { method:'POST', body: JSON.stringify(Object.assign({ description:'Données Appastry', public:false }, this.payload())) }); this.cfg.gistId = g.id; this.cfg.last = Date.now(); this.saveCfg(); this.set('ok', 'Données envoyées'); }
    } catch (e) { this.cfg.token = ''; this.cfg.gistId = ''; this.saveCfg(); this.set('err', e.message || 'Connexion impossible.'); throw e; }
  },
  disconnect(){ this.cfg = { token:'', gistId:'', last:0 }; this.saveCfg(); this.set('off'); },
  async pull(force){
    if (!this.on()) return;
    this.set('busy', 'Récupération…');
    try {
      const g = await this.api('/gists/' + this.cfg.gistId);
      const f = g.files['patisscalc.json']; if (!f) throw new Error('Fichier de données introuvable dans le Gist.');
      const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
      const remote = normalize(JSON.parse(txt));
      if (force || (remote.settings.updatedAt || 0) > (db.settings.updatedAt || 0)) {
        db = remote; save({ keepTime: true, noSync: true }); applyTheme(); rerender(); toast('Données synchronisées');
      } else if ((remote.settings.updatedAt || 0) < (db.settings.updatedAt || 0)) { await this.push(); return; }
      this.cfg.last = Date.now(); this.saveCfg(); this.set('ok');
    } catch (e) { this.set('err', e.message || 'Synchronisation impossible.'); }
  },
  async push(){
    if (!this.on()) return;
    this.set('busy', 'Envoi…');
    try { await this.api('/gists/' + this.cfg.gistId, { method:'PATCH', body: JSON.stringify(this.payload()) }); this.cfg.last = Date.now(); this.saveCfg(); this.set('ok'); }
    catch (e) { this.set('err', e.message || 'Envoi impossible.'); }
  },
  schedule(){ if (!this.on()) return; clearTimeout(this.timer); this.state = 'busy'; this.msg = 'Modifications en attente…'; renderSideFoot(); this.timer = setTimeout(() => this.push(), 1500); }
};
function syncStatusHtml(){
  const s = Sync.state;
  const t = Sync.cfg.last ? new Date(Sync.cfg.last).toLocaleString('fr-FR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
  if (s === 'off') return '<span class="sync-dot"></span>Synchronisation désactivée';
  if (s === 'busy') return '<span class="sync-dot busy"></span>' + esc(Sync.msg || 'Synchronisation…');
  if (s === 'err') return '<span class="sync-dot err"></span>' + esc(Sync.msg);
  return '<span class="sync-dot ok"></span>Synchronisé' + (t ? ' · ' + t : '');
}
function renderSideFoot(){
  const el = document.getElementById('side-foot'); if (!el) return;
  el.innerHTML = Sync.cfg.token ? `<a href="#reglages" style="color:inherit;text-decoration:none">${syncStatusHtml()}</a>` : 'Données enregistrées sur cet appareil. Active la synchronisation dans Réglages pour les retrouver partout.';
}

function priceChange(ing){ // variation du prix de référence entre les deux derniers relevés
  const h = ing.history || []; if (h.length < 2) return 0;
  const a = unitPrice(h[h.length-2]), b = unitPrice(h[h.length-1]);
  return a > 0 ? (b - a) / a : 0;
}

  });
  const mat = rows.reduce((s, x) => s + x.cost, 0);
  const time = recipeTime(r);
  const lab = labor(time);

    <div class="toolbar">${printBtn()}<button class="btn" data-act="dup-recipe" data-id="${id}">${ic('copy')}Dupliquer</button><button class="btn primary" data-act="edit-recipe" data-id="${id}">${ic('edit')}Modifier</button></div></div>
  <p class="print-only">Pour ${plural(nf.format(target),'portion')}</p>
  <div class="split">
    <section class="panel">

      ${rows.map(x => x.it.sub

        : `<tr><td>${x.ing ? esc(x.ing.name) : '<span class="tag warn">ingrédient supprimé</span>'}</td><td class="r">${qtyLabel(x.it.qty * f, x.it.unit)}</td><td class="r">${E(x.cost)}<span class="share hide-sm"><i style="width:${mat ? Math.round(x.cost/mat*100) : 0}%"></i></span></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">Aucun ingrédient. Clique sur Modifier pour en ajouter.</div>'}
      <div class="panel-b" style="border-top:1px solid var(--line)"><div class="sectlabel" style="margin-bottom:8px">Allergènes</div>${allergenTags(recipeAllergens(r))}</div>

      <div class="costline"><span>Main d’œuvre (${mins(time)} à ${E(db.settings.hourlyRate)}/h)</span><b>${E(lab)}</b></div>
      <div class="costline total"><span>Par portion</span><b>${E(tot / (target || 1))}</b></div>
      <div class="costline no-print"><span>Prix conseillé TTC (×${nf.format(db.settings.marginCoef)})</span><b>${E(sug.ttc)}</b></div>
      <div class="costline no-print"><span>soit par portion</span><b>${E(sug.ttc / (target || 1))}</b></div>

  <section class="panel"><div class="panel-h"><h2>Étapes</h2><span class="hint no-print">Touche une étape pour la cocher</span></div><div class="panel-b">

function stepsHtml(steps, key){
  const done = ui.done[key] || {};
  return (steps||[]).length ? `<ol class="steps">${steps.map((s,k) => `<li data-step="${key}:${k}" class="${done[k]?'done':''}">${esc(s)}</li>`).join('')}</ol>` : '<p class="hint" style="margin:0">Aucune étape.</p>';
}

function recipeForm(r, dup){
  const isNew = !r || dup;
  const src = r ? clone(r) : { name:'', category:'Biscuits', servings:6, prep:15, cook:0, notes:'', items:[], steps:[] };
  if (dup) src.name = src.name + ' (copie)';
  const selfId = (!isNew && r) ? r.id : null;
  // Forme d'édition uniforme : { key:'i:ID' | 'r:ID' | '', qty, unit }
  const d = Object.assign({}, src, { items: src.items.map(it => it.sub ? { key:'r:'+it.sub, qty:it.mult, unit:'' } : { key:'i:'+it.ing, qty:it.qty, unit:it.unit }) });
  if (!d.items.length) d.items.push({ key:'', qty:'', unit:'g' });
  const subOk = rec => !selfId || !contains(rec, selfId);
  const opts = (sel) => `<option value="">Choisir…</option><optgroup label="Ingrédients">` + db.ingredients.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(i => `<option value="i:${i.id}" ${'i:'+i.id===sel?'selected':''}>${esc(i.name)}</option>`).join('') + `</optgroup><optgroup label="Recettes (sous-recette)">` + db.recipes.filter(x => x.id !== selfId && subOk(x)).sort((a,b)=>a.name.localeCompare(b.name)).map(x => `<option value="r:${x.id}" ${'r:'+x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('') + `</optgroup>`;
  const unitCell = it => {
    if (it.key.startsWith('r:')) return `<span class="fixed-unit unit-cell">× recette</span>`;
    const ing = ING(it.key.slice(2)); const list = ing ? COMPAT[baseOf(ing.unit)] : UNITS;
    return `<select class="input unit-cell" data-f="unit" aria-label="Unité">${list.map(u => `<option ${u===it.unit?'selected':''}>${u}</option>`).join('')}</select>`;
  };
  const toItems = () => d.items.filter(i => i.key && +i.qty > 0).map(i => i.key.startsWith('r:') ? { sub: i.key.slice(2), mult: +i.qty } : { ing: i.key.slice(2), qty: +i.qty, unit: i.unit });
  const drawItems = () => {
    document.getElementById('fr-items').innerHTML = d.items.map((it, k) => `
      <div class="row-line" data-k="${k}">
        <select class="input sel-cell" data-f="key" aria-label="Ingrédient ou recette">${opts(it.key)}</select>
        <input class="input num qty-cell" data-f="qty" type="number" step="any" min="0" value="${esc(it.qty)}" placeholder="${it.key.startsWith('r:') ? '×' : 'Qté'}" aria-label="Quantité">
        ${unitCell(it)}
        <button type="button" class="btn icon ghost rm-cell" data-rm-item="${k}" aria-label="Retirer">${ic('x')}</button>
      </div>`).join('');
    drawCost();
  };
  const drawSteps = () => {
    document.getElementById('fr-steps').innerHTML = d.steps.length ? d.steps.map((s, k) => `
      <div class="step-line" data-k="${k}"><b>${k+1}</b><textarea class="input" rows="2" data-step-txt="${k}" aria-label="Étape ${k+1}">${esc(s)}</textarea>
      <div class="acts"><button type="button" class="btn icon ghost" data-mv="${k}:-1" aria-label="Monter" ${k===0?'disabled':''}>${ic('up')}</button><button type="button" class="btn icon ghost" data-mv="${k}:1" aria-label="Descendre" ${k===d.steps.length-1?'disabled':''}>${ic('down')}</button><button type="button" class="btn icon ghost" data-rm-step="${k}" aria-label="Supprimer">${ic('x')}</button></div></div>`).join('') : '<p class="hint" style="margin:0">Aucune étape.</p>';
  };
  const drawCost = () => { const c = recipeCost({ items: toItems() }); document.getElementById('fr-cost').textContent = 'Coût matières : ' + E(c) + ' · ' + E(c/(+d.servings||1)) + ' / portion'; };
  openModal(`
  <form id="f-rec">
    <div class="modal-h"><h2>${dup ? 'Dupliquer la recette' : isNew ? 'Nouvelle recette' : 'Modifier la recette'}</h2><button type="button" class="btn icon ghost" data-close aria-label="Fermer">${ic('x')}</button></div>
    <div class="modal-b">
      <label class="f">Nom<input class="input" id="fr-name" required value="${esc(d.name)}" placeholder="Ex : Crème pâtissière"></label>
      <div class="grid2">
        <label class="f">Catégorie<select class="input" id="fr-cat">${REC_CATS.concat(REC_CATS.includes(d.category)?[]:[d.category]).map(c => `<option ${c===d.category?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
        <label class="f">Portions<input class="input num" id="fr-serv" type="number" min="1" step="any" required value="${esc(d.servings)}"></label>
      </div>
      <div class="grid2">
        <label class="f">Préparation (min)<input class="input num" id="fr-prep" type="number" min="0" value="${esc(d.prep)}"></label>
        <label class="f">Cuisson (min)<input class="input num" id="fr-cook" type="number" min="0" value="${esc(d.cook)}"></label>
      </div>
      <div class="sectlabel">Ingrédients et sous-recettes <span class="hint" id="fr-cost"></span></div>
      <p class="hint" style="margin:-6px 0 0">Tu peux aussi choisir une autre recette (ex. une crème pâtissière dans une crème mousseline) : indique combien de fois elle est utilisée, par exemple 0,5 pour une demi-recette.</p>
      <div class="rows" id="fr-items"></div>
      <div><button type="button" class="btn sm" id="fr-add-item">${ic('plus')}Ajouter une ligne</button>${db.ingredients.length ? '' : ' <span class="hint">Crée d’abord des ingrédients.</span>'}</div>
      <div class="sectlabel">Étapes</div>
      <div class="rows" id="fr-steps"></div>
      <div><button type="button" class="btn sm" id="fr-add-step">${ic('plus')}Ajouter une étape</button></div>
      <label class="f">Notes<textarea class="input" id="fr-notes" rows="2" placeholder="Astuces, conservation…">${esc(d.notes)}</textarea></label>
      <div id="fr-confirm"></div>
    </div>
    <div class="modal-f">
      ${!isNew ? `<button type="button" class="btn danger left" id="fr-del">${ic('trash')}Supprimer</button>` : ''}
      <button type="button" class="btn" data-close>Annuler</button>
      <button class="btn primary" type="submit">${isNew ? 'Créer la recette' : 'Enregistrer'}</button>
    </div>
  </form>`);
  drawItems(); drawSteps();
  const form = document.getElementById('f-rec');
  document.getElementById('fr-serv').addEventListener('input', e => { d.servings = +e.target.value; drawCost(); });
  form.addEventListener('change', e => {
    const row = e.target.closest('.row-line'); if (!row) return;
    const k = +row.dataset.k, f = e.target.dataset.f, it = d.items[k];
    if (f === 'key') {
      it.key = e.target.value;
      if (it.key.startsWith('r:')) { if (!(+it.qty > 0) || +it.qty > 20) it.qty = 1; }
      else { const ing = ING(it.key.slice(2)); if (ing) { const ok = COMPAT[baseOf(ing.unit)]; if (!ok.includes(it.unit)) it.unit = ok[0]; } }
      drawItems();
    }
    if (f === 'unit') { it.unit = e.target.value; drawCost(); }
  });
  form.addEventListener('input', e => {
    const row = e.target.closest('.row-line');
    if (row && e.target.dataset.f === 'qty') { d.items[+row.dataset.k].qty = e.target.value === '' ? '' : +e.target.value; drawCost(); }
    if (e.target.dataset.stepTxt !== undefined) d.steps[+e.target.dataset.stepTxt] = e.target.value;
  });
  form.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.id === 'fr-add-item') { d.items.push({ key:'', qty:'', unit:'g' }); drawItems(); form.querySelector(`.row-line[data-k="${d.items.length-1}"] select`).focus(); }
    else if (t.dataset.rmItem !== undefined) { d.items.splice(+t.dataset.rmItem, 1); drawItems(); }
    else if (t.id === 'fr-add-step') { d.steps.push(''); drawSteps(); form.querySelector(`[data-step-txt="${d.steps.length-1}"]`).focus(); }
    else if (t.dataset.rmStep !== undefined) { d.steps.splice(+t.dataset.rmStep, 1); drawSteps(); }
    else if (t.dataset.mv) { const [k, dir] = t.dataset.mv.split(':').map(Number); const j = k + dir; [d.steps[k], d.steps[j]] = [d.steps[j], d.steps[k]]; drawSteps(); }
    else if (t.id === 'fr-del') {
      const used = recipeUsage(r.id), parents = recipeParents(r.id); const box = document.getElementById('fr-confirm');
      const where = used.map(c => c.name).concat(parents.map(p => p.name));
      box.innerHTML = `<div class="confirm-bar">${where.length ? `Elle sera aussi retirée de : ${where.map(esc).join(', ')}.` : 'Supprimer définitivement ?'}<button type="button" class="btn sm danger solid" id="fr-del-ok">Supprimer</button><button type="button" class="btn sm" id="fr-del-no">Annuler</button></div>`;
      document.getElementById('fr-del-no').onclick = () => box.innerHTML = '';
      document.getElementById('fr-del-ok').onclick = () => {
        db.recipes = db.recipes.filter(x => x.id !== r.id);
        db.recipes.forEach(x => x.items = x.items.filter(it => it.sub !== r.id));
        db.cakes.forEach(c => c.parts = c.parts.filter(p => p.rec !== r.id));
        db.order = db.order.filter(o => !(o.type === 'r' && o.id === r.id));
        db.orders.forEach(o => o.items = o.items.filter(x => !(x.type === 'r' && x.id === r.id)));
        save(); closeModal(); go('recettes'); toast('Recette supprimée');
      };
    }
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const out = { name: val('fr-name').trim(), category: val('fr-cat'), servings: +val('fr-serv') || 1, prep: +val('fr-prep') || 0, cook: +val('fr-cook') || 0, notes: val('fr-notes').trim(),
      items: toItems(), steps: d.steps.map(s => s.trim()).filter(Boolean) };
    if (!out.name) return;
    let id;
    if (isNew) { id = uid('r'); db.recipes.push(Object.assign({ id }, out)); } else { Object.assign(r, out); id = r.id; delete ui.scale['r'+id]; }
    save(); closeModal(); go('recette-' + id); toast(isNew ? 'Recette créée' : 'Recette enregistrée');
  });
  document.getElementById('fr-name').focus();
}

function resizeImage(file){
  return new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const max = 900; const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); resolve(cv.toDataURL('image/jpeg', 0.72));
    }; img.onerror = reject; img.src = rd.result; };
    rd.onerror = reject; rd.readAsDataURL(file);
  });
}

/* ---------- Calculateur ---------- */
function vCalc(){
  const calc = computeOrder(db.order);
  const { items, agg, mat, time, lab, tot, parts } = calc;
  agg.forEach(a => { const ing = ING(a.id); a.stock = ing && ing.stock != null ? +ing.stock : null; a.buy = a.stock == null ? a.q : Math.max(0, a.q - a.stock); });
  window.__agg = agg;
  const sug = items.reduce((s, x) => s + (x.o.type === 'c' && x.src.salePrice ? x.src.salePrice * x.o.qty : suggested(x.tot).ttc), 0);
  const opts = `<optgroup label="Gâteaux">${db.cakes.map(c => `<option value="c:${c.id}">${esc(c.name)}</option>`).join('')}</optgroup><optgroup label="Recettes de base">${db.recipes.map(r => `<option value="r:${r.id}">${esc(r.name)}</option>`).join('')}</optgroup>`;

/* ---------- Devis et factures ---------- */
function vDoc(kind, id){
  const o = ORDER(id); if (!o) { view.innerHTML = `<div class="panel empty"><b>Commande introuvable</b><a href="#commandes">Retour aux commandes</a></div>`; return; }
  const co = db.settings.company; const exempt = !!co.vatExempt; const tva = +db.settings.tva || 0;
  const isInv = kind === 'f'; const year = today().slice(0, 4);
  if (isInv && !o.invoiceNo) { db.settings.invoiceSeq = (+db.settings.invoiceSeq || 0) + 1; o.invoiceNo = 'F' + year + '-' + String(db.settings.invoiceSeq).padStart(3, '0'); o.invoiceDate = today(); save(); }
  if (!isInv && !o.quoteNo) { db.settings.quoteSeq = (+db.settings.quoteSeq || 0) + 1; o.quoteNo = 'D' + year + '-' + String(db.settings.quoteSeq).padStart(3, '0'); o.quoteDate = today(); save(); }
  const calc = computeOrder(o.items);
  const base = calc.items.map(x => ({ name: x.src.name, qty: +x.o.qty, ttc: x.o.type === 'c' && x.src.salePrice ? x.src.salePrice * x.o.qty : suggested(x.tot).ttc }));
  const sum = base.reduce((s, l) => s + l.ttc, 0); const total = +o.price > 0 ? +o.price : sum; const k = sum > 0 ? total / sum : 1;
  const lines = base.map(l => Object.assign({}, l, { ttc: l.ttc * k }));
  const ht = exempt ? total : total / (1 + tva / 100); const vat = total - ht;
  const no = isInv ? o.invoiceNo : o.quoteNo; const date = isInv ? o.invoiceDate : o.quoteDate;
  view.innerHTML = `
  <div class="head no-print"><div><a class="crumb" href="#commandes">${ic('back')}Commandes</a><h1>${isInv ? 'Facture' : 'Devis'} ${esc(no)}</h1><p>${co.name ? '' : 'Renseigne ton entreprise dans Réglages pour compléter l’en-tête. '}${IN_FRAME ? 'L’impression et l’enregistrement en PDF fonctionnent sur la version publiée sur GitHub.' : 'Choisis « Enregistrer au format PDF » dans la fenêtre d’impression pour l’envoyer au client.'}</p></div>
    <div class="toolbar">${IN_FRAME ? '' : `<button class="btn primary" data-act="print">${ic('print')}Imprimer ou PDF</button>`}<a class="btn" href="#reglages">Mon entreprise</a></div></div>
  <article class="doc">
    <div class="row"><div><h1>${esc(co.name || 'Ton entreprise')}</h1><div class="muted" style="white-space:pre-line">${esc(co.address)}</div><div class="muted">${[co.phone, co.email].filter(Boolean).map(esc).join(' · ')}</div>${co.siret ? `<div class="muted">SIRET ${esc(co.siret)}</div>` : ''}</div>
      <div style="text-align:right"><h2 style="color:#222">${isInv ? 'FACTURE' : 'DEVIS'}</h2><div>N° <b>${esc(no)}</b></div><div class="muted">Date : ${dateFr(date)}</div>${o.date ? `<div class="muted">Retrait ${isInv ? '' : 'prévu '}le ${dateFr(o.date)}${o.time ? ' à ' + esc(o.time) : ''}</div>` : ''}</div></div>
    <div style="margin-top:24px"><div class="muted">${isInv ? 'Facturé à' : 'Client'}</div><b>${esc(o.client)}</b><div style="white-space:pre-line">${esc(o.address || '')}</div><div class="muted">${[o.phone, o.email].filter(Boolean).map(esc).join(' · ')}</div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Désignation</th><th class="r">Parts</th><th class="r">Prix / part${exempt ? '' : ' TTC'}</th><th class="r">Total${exempt ? '' : ' TTC'}</th></tr></thead><tbody>
      ${lines.map(l => `<tr><td>${esc(l.name)}</td><td class="r">${l.qty}</td><td class="r">${E(l.ttc / (l.qty || 1))}</td><td class="r">${E(l.ttc)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="totals">
      ${exempt ? `<div class="grand"><span>Total</span><span>${E(total)}</span></div>` : `<div><span>Total HT</span><span>${E(ht)}</span></div><div><span>TVA ${nf.format(tva)} %</span><span>${E(vat)}</span></div><div class="grand"><span>Total TTC</span><span>${E(total)}</span></div>`}
      ${+o.deposit > 0 ? `<div><span>Acompte ${isInv ? 'reçu' : 'demandé'}</span><span>− ${E(o.deposit)}</span></div><div><b>${isInv ? 'Reste à payer' : 'Solde au retrait'}</b><b>${E(total - o.deposit)}</b></div>` : ''}
    </div>
    ${calc.allergens.length ? `<p style="margin-top:18px"><b>Allergènes :</b> ${calc.allergens.map(esc).join(', ')}</p>` : ''}
    ${o.notes ? `<p class="muted">${esc(o.notes)}</p>` : ''}
    ${isInv ? '' : `<div class="sign">Bon pour accord, date et signature :</div>`}
    <div class="foot">
      ${exempt ? '<div>TVA non applicable, art. 293 B du CGI.</div>' : ''}
      <div>${isInv ? 'Paiement à réception de la facture.' : 'Devis valable 30 jours.'}</div>
      ${co.footer ? `<div style="white-space:pre-line">${esc(co.footer)}</div>` : ''}
    </div>
  </article>`;
}

/* ---------- Étiquettes ---------- */
function ingredientDeclaration(c){
  const agg = aggregate((c.parts || []).map(p => ({ r: REC(p.rec), factor: p.mult })).filter(x => x.r));
  const w = a => a.base === 'unité' ? a.q * 50 : a.q; // pièces (œufs…) comptées 50 g
  return agg.slice().sort((a, b) => w(b) - w(a)).map(a => { const ing = ING(a.id); return ing && ing.allergens.length ? `<b>${esc(a.name)}</b>` : esc(a.name); }).join(', ');
}

/* ---------- Presse-papiers ---------- */
function copy(text, ok){
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(ok); } catch(e) { toast('Copie impossible, sélectionne le texte manuellement'); } ta.remove(); };
  try { navigator.clipboard.writeText(text).then(() => toast(ok), fallback); } catch(e) { fallback(); }
}

/* ---------- Délégation des clics ---------- */
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act, id = a.dataset.id;
    if (act === 'new-ing') return ingForm();
    if (act === 'new-recipe') return recipeForm();
    if (act === 'edit-recipe') return recipeForm(REC(id));
    if (act === 'dup-recipe') return recipeForm(REC(id), true);
    if (act === 'new-cake') { if (!db.recipes.length) return toast('Crée d’abord une recette de base'); return cakeForm(); }
    if (act === 'edit-cake') return cakeForm(CAKE(id));
    if (act === 'new-order') return orderForm();
    if (act === 'cake-to-order') { const c = CAKE(id); return orderForm(null, [{ type:'c', id, qty: ui.scale['c'+id] || c.servings }]); }
    if (act === 'calc-to-order') return orderForm(null, clone(db.order));
    if (act === 'print') return window.print();
    if (act === 'market-refresh') { a.disabled = true; toast('Mise à jour des prix…'); await refreshMarketPrices(false); return; }
    if (act === 'stock-add') { const n = addStock(window.__agg || []); save(); vCalc(); return toast(n ? 'Achats ajoutés au stock' : 'Rien à ajouter : tout est en stock'); }
    if (act === 'stock-use') { const n = useStock(window.__agg || []); save(); vCalc(); return toast(n ? 'Quantités déduites du stock' : 'Aucun ingrédient suivi en stock'); }
    if (act === 'add-order') {
      const v = val('add-src'); if (!v) return; const [type, oid] = v.split(':');
      const src = type === 'c' ? CAKE(oid) : REC(oid); const q = +val('add-qty') || src.servings;
      db.order.push({ type, id: oid, qty: q }); save(); return vCalc();
    }
    if (act === 'clear-order') { db.order = []; ui.done = {}; save(); return vCalc(); }
    if (act === 'copy-list') return copy(window.__shopping || '', 'Liste de courses copiée');
    if (act === 'copy-backup') return copy(JSON.stringify(db, null, 1), 'Sauvegarde copiée');
    if (act === 'import-paste') { const t = val('st-paste').trim(); if (t) importText(t); return; }
    if (act === 'sync-connect') {
      const tok = val('st-token').trim(); if (!tok) return toast('Colle d’abord ton jeton GitHub');
      try { await Sync.connect(tok); toast('Synchronisation activée'); vSettings(); }
      catch (err) { vSettings(); if (IN_FRAME) document.getElementById('sync-status').innerHTML = '<span class="sync-dot err"></span>La synchronisation fonctionne sur la version publiée sur GitHub, pas dans cet aperçu.'; }
      return;
    }
    if (act === 'sync-now') { await Sync.pull(); return; }
    if (act === 'sync-off') { Sync.disconnect(); toast('Cet appareil n’est plus synchronisé'); return vSettings(); }
    if (act === 'reset' || act === 'reseed') {
      const box = document.getElementById('st-confirm');
      box.innerHTML = `<div class="confirm-bar">${act === 'reset' ? 'Effacer toutes les données ?' : 'Remplacer tes données par celles de départ ?'}<button class="btn sm danger solid" id="st-ok">Confirmer</button><button class="btn sm" id="st-no">Annuler</button></div>`;
      document.getElementById('st-no').onclick = () => box.innerHTML = '';
      document.getElementById('st-ok').onclick = () => {
        const keep = Object.assign({}, db.settings); db = act === 'reset' ? normalize({ settings: keep }) : normalize(clone(SEED)); db.settings = keep; save(); toast(act === 'reset' ? 'Données effacées' : 'Données de départ rechargées'); vSettings();
      };
      return;
    }
  }
  const ei = e.target.closest('[data-edit-ing]'); if (ei) return ingForm(ING(ei.dataset.editIng));
  const eo = e.target.closest('[data-edit-order]'); if (eo) return orderForm(ORDER(eo.dataset.editOrder));
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const ch = e.target.closest('[data-ingcat]'); if (ch) { ui.ingCat = ch.dataset.ingcat; return vIngredients(); }
  const rc = e.target.closest('[data-reccat]'); if (rc) { ui.recCat = rc.dataset.reccat; return vRecipes(); }
  const of = e.target.closest('[data-ordf]'); if (of) { ui.ordFilter = of.dataset.ordf; return vOrders(); }
  const th = e.target.closest('[data-theme-set]'); if (th) { db.settings.theme = th.dataset.themeSet; save(); applyTheme(); return vSettings(); }
  const sc = e.target.closest('[data-scale]');
  if (sc) { const key = sc.dataset.key; const cur = ui.scale[key] || +sc.dataset.base; ui.scale[key] = Math.max(1, Math.round(cur) + (+sc.dataset.scale)); return rerender(); }
  const st = e.target.closest('[data-step]');
  if (st) { const [key, k] = st.dataset.step.split(':'); ui.done[key] = ui.done[key] || {}; ui.done[key][k] = !ui.done[key][k]; st.classList.toggle('done'); return; }
  const ro = e.target.closest('[data-rm-order]'); if (ro) { db.order.splice(+ro.dataset.rmOrder, 1); ui.done = {}; save(); return vCalc(); }
});

/* ---------- Démarrage ---------- */
load(); Sync.loadCfg(); applyTheme(); renderSideFoot();
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
route();
if (Sync.on()) Sync.pull();
setTimeout(() => { if (!IN_FRAME && db.ingredients.some(i => i.offAuto) && Date.now() - (+db.settings.lastPriceRefresh || 0) > 7 * 864e5) refreshMarketPrices(true); }, 3000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Sync.on()) Sync.pull(); });
})();
</script>

</body>
</html>
